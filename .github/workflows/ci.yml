# Lint, type check, test, migrate, build. Section 7.2 calls CI non-negotiable even solo, because it is
# the only thing standing between a bad prompt or a bad migration and production.
#
# Every job here runs the same command a developer runs locally. There is no CI-only script and no
# CI-only flag, so a green build means the thing that was tested is the thing that ships.

name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  PYTHONUTF8: "1"

jobs:
  python:
    name: python
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: auspice
          POSTGRES_PASSWORD: auspice
          POSTGRES_DB: auspice_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U auspice -d auspice_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      AUSPICE_ENV: test
      AUSPICE_DATABASE_URL: postgresql+psycopg://auspice:auspice@127.0.0.1:55432/auspice_test
      AUSPICE_TEST_DATABASE_URL: postgresql+psycopg://auspice:auspice@127.0.0.1:55432/auspice_test
      AUSPICE_CRAWLER_CONTACT: ci@auspice.example

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Enable extensions
        # CREATE EXTENSION needs superuser, so it happens here rather than in a migration. The first
        # migration asserts they are present and fails loudly if they are not.
        run: |
          PGPASSWORD=auspice psql -h 127.0.0.1 -p 55432 -U auspice -d auspice_test \
            -v ON_ERROR_STOP=1 -f infra/scripts/db-extensions.sql

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Migrate
        run: uv run alembic -c infra/alembic.ini upgrade head

      - name: Schema has no pending drift
        # The schema module is the source of truth and the migrations are generated from it. Drift here
        # would surface later as a confusing query error rather than as a migration problem.
        run: uv run alembic -c infra/alembic.ini check

      - name: Registry and labels are valid
        run: |
          uv run auspice registry validate
          uv run auspice labels validate

      - name: Test
        run: uv run pytest -q --cov --cov-report=term-missing --cov-report=xml

      - name: The kill test reports its honest state
        # It prints INSUFFICIENT DATA below the sample size floors and exits zero. This step exists so
        # that state is visible in every build rather than discovered when someone asks for the number.
        run: uv run auspice eval sufficiency

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install uv
        # The generated types check regenerates the OpenAPI document from the FastAPI application, so
        # this job needs Python as well as Node. Cheaper than booting the API over HTTP just to have it
        # describe itself, and it cannot drift from the code the way a running server's document can.
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Dependency audit
        # Fails on anything new. Assessed advisories are recorded in scripts/check-audit.mjs with a
        # reason and a review date, so the report is neither muted nor permanently ignored.
        run: node scripts/check-audit.mjs

      - name: Generated types match the API
        # packages/shared-types is generated, so it is only a single source of truth if the derivation is
        # checked. Without this a route can change its response shape while the web application keeps
        # compiling against the old one, and the mismatch surfaces at runtime as an undefined field.
        run: npm run types:check

      - name: Design tokens all resolve
        # CSS resolves an undefined custom property to nothing, so a token name that does not exist renders
        # as a missing colour or a default font size and passes lint, types and the build. Three did.
        run: npm run check:tokens --workspace apps/web

      - name: Lint
        run: npm run lint --workspace apps/web

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build --workspace apps/web
        env:
          # The public pages read the API at build time. Without it they render their unavailable state,
          # which still has to compile and is worth exercising.
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000

      - name: Performance budget
        # Measured gzipped. See the script for why the specification's 100 kB figure was amended.
        run: npm run budget --workspace apps/web

  writing:
    name: writing rules
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: No em dashes, no banned vocabulary, no emoji
        # The mechanical part of the writing rules is testable, so it is tested rather than remembered.
        run: uv run --no-project python tools/check_writing.py
