name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUSPICE_ENV: test
      AUSPICE_TEST_DATABASE_URL: postgresql+psycopg://auspice:auspice@127.0.0.1:55432/auspice_test
      AUSPICE_CRAWLER_CONTACT: ci@auspice.example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build database image
        run: docker build --file infra/Dockerfile.db --tag auspice-db:ci .
      - name: Start database
        run: |
          docker run --detach \
            --name auspice-db-ci \
            --env POSTGRES_USER=auspice \
            --env POSTGRES_PASSWORD=auspice \
            --env POSTGRES_DB=auspice_test \
            --publish 127.0.0.1:55432:5432 \
            --health-cmd "pg_isready -U auspice -d auspice_test" \
            --health-interval 2s \
            --health-timeout 5s \
            --health-retries 60 \
            --mount "type=bind,source=$PWD/infra/scripts/db-extensions.sql,target=/docker-entrypoint-initdb.d/10-extensions.sql,readonly" \
            auspice-db:ci

          for attempt in {1..60}; do
            extension_count="$(PGPASSWORD=auspice psql \
              --host 127.0.0.1 \
              --port 55432 \
              --username auspice \
              --dbname auspice_test \
              --tuples-only \
              --no-align \
              --command "SELECT count(*) FROM pg_extension WHERE extname IN ('postgis','pg_trgm','vector','btree_gist')" \
              2>/dev/null || true)"
            if [[ "$extension_count" == "4" ]]; then
              echo "Database is ready with all required extensions"
              exit 0
            fi
            sleep 2
          done

          docker logs auspice-db-ci
          exit 1
      - name: Install Python dependencies
        run: uv sync --all-extras --dev
      - name: Verify extensions
        run: >-
          PGPASSWORD=auspice psql
          --host 127.0.0.1
          --port 55432
          --username auspice
          --dbname auspice_test
          --set ON_ERROR_STOP=1
          --file infra/scripts/db-extensions.sql
      - name: Migrate test database
        run: uv run alembic -c infra/alembic.ini upgrade head
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run python -m mypy
      - name: Pytest
        run: uv run python -m pytest --cov=auspice --cov=apps/api/app --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
      - name: Print database logs
        if: failure()
        run: docker logs auspice-db-ci || true
      - name: Remove database
        if: always()
        run: docker rm --force auspice-db-ci || true

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm run audit:check
      - name: Shared type derivation check
        run: npm run types:check
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Vitest
        run: npm run test --workspace apps/web
      - name: Next production build
        run: npm run build --workspace apps/web

  visual:
    name: visual regression
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      AUSPICE_CRAWLER_CONTACT: ci@auspice.example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Cache PostgreSQL toolchain
        uses: actions/cache@v4
        with:
          path: |
            .tools/cache
            .tools/pgsql
          key: windows-postgres-${{ hashFiles('infra/scripts/bootstrap-postgres.ps1') }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install Python dependencies
        run: uv sync --all-extras --dev
      - run: npm ci
      - name: Install Chromium
        run: npm --prefix apps/web exec playwright install --with-deps chromium
      - name: Start PostgreSQL
        shell: pwsh
        run: infra/scripts/bootstrap-postgres.ps1
      - name: Migrate and load deterministic data
        shell: pwsh
        run: |
          uv run alembic -c infra/alembic.ini upgrade head
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run auspice registry load
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run auspice labels load
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Start API
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'auspice-api.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'auspice-api.stderr.log'
          $uv = (Get-Command uv).Source
          $process = Start-Process `
            -FilePath $uv `
            -ArgumentList @('run', 'uvicorn', 'app.main:app', '--app-dir', 'apps/api', '--host', '127.0.0.1', '--port', '8000') `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru
          Add-Content -Path $env:GITHUB_ENV -Value "AUSPICE_API_PID=$($process.Id)"
      - name: Wait for API
        shell: pwsh
        run: |
          $ready = $false
          for ($attempt = 1; $attempt -le 60; $attempt++) {
            try {
              $response = Invoke-WebRequest -Uri 'http://127.0.0.1:8000/healthz' -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -eq 200) {
                $ready = $true
                break
              }
            } catch {
              # The bounded loop reports both API streams if startup never completes.
            }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) {
            Get-Content (Join-Path $env:RUNNER_TEMP 'auspice-api.stdout.log') -Tail 200 -ErrorAction SilentlyContinue
            Get-Content (Join-Path $env:RUNNER_TEMP 'auspice-api.stderr.log') -Tail 200 -ErrorAction SilentlyContinue
            throw 'API did not become healthy within 120 seconds'
          }
      - name: Build application
        run: npm run build --workspace apps/web
      - name: Run visual suite
        run: npm run test:visual --workspace apps/web
      - name: Upload visual diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            ${{ runner.temp }}/auspice-api.stdout.log
            ${{ runner.temp }}/auspice-api.stderr.log
            var/pg.log
      - name: Stop API and PostgreSQL
        if: always()
        shell: pwsh
        run: |
          if ($env:AUSPICE_API_PID) {
            & taskkill.exe /PID $env:AUSPICE_API_PID /T /F 2>$null
          }

          $pgCtl = Join-Path $env:GITHUB_WORKSPACE '.tools\pgsql\bin\pg_ctl.exe'
          $dataDir = Join-Path $env:GITHUB_WORKSPACE 'var\pgdata'
          if ((Test-Path $pgCtl) -and (Test-Path $dataDir)) {
            & $pgCtl -D $dataDir status *> $null
            if ($LASTEXITCODE -eq 0) {
              & $pgCtl -D $dataDir -m fast -w stop
            }
          }

  writing:
    name: writing rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tools/check_writing.py
      - run: python tools/check_line_endings.py
      - name: Credential-shaped value scan
        run: python tools/check_no_secrets.py
