<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="templum-rev-title">
  <title id="templum-rev-title">Permission Bureau</title>
  <!--
    Reversed: paper on ink, with the read quadrant in brass. Used on dark surfaces and in the app
    icon. The quadrant is the only place brass appears in the mark, which is the same rule the
    interface follows: one chromatic colour, used once, to say where to look.
  -->
  <rect width="24" height="24" fill="#0E1013" />
  <g fill="none" stroke="#E8E8E4" stroke-width="1.4" stroke-linecap="butt">
    <rect x="12" y="5" width="9" height="8" fill="#C99A3C" stroke="none" />
    <rect x="3" y="5" width="18" height="16" />
    <path d="M3 13H21" />
    <path d="M12 1.4V22.6" />
  </g>
</svg>
