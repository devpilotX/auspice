<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="templum-title templum-desc">
  <title id="templum-title">Permission Bureau</title>
  <desc id="templum-desc">A templum: a marked field of sky divided into quadrants, with the upper right quadrant read.</desc>
  <!--
    The mark is a templum, not a bird, not an eye, not a shield. It is the instrument.

    Roman augurs marked out a square region of sky, divided it into quadrants, and read the signs
    inside it to determine whether a public action was permitted to proceed. That marked field was the
    templum, and the practice is where the word auspice comes from.

    Geometry on a 24 by 24 grid, exactly as specified:
      rectangle from 3,5 to 21,21, stroke 1.4
      horizontal line across at y = 13
      vertical line at x = 12 running from 1.4 to 22.6, so it extends past the box at both ends
      the upper right quadrant filled solid, which is the quadrant being read

    The overshoot on the vertical is the sightline. It is the detail that makes the mark specific
    rather than generic, so it is never trimmed to fit a bounding box.
  -->
  <g fill="none" stroke="#14161A" stroke-width="1.4" stroke-linecap="butt">
    <!-- The quadrant being read. Filled before the strokes so the hairlines sit on top of it. -->
    <rect x="12" y="5" width="9" height="8" fill="#14161A" stroke="none" />
    <!-- The marked field. -->
    <rect x="3" y="5" width="18" height="16" />
    <!-- The horizontal division. -->
    <path d="M3 13H21" />
    <!-- The sightline, overshooting at both ends. -->
    <path d="M12 1.4V22.6" />
  </g>
</svg>
