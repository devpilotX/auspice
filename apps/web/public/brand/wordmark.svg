<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 24" width="200" height="24" role="img" aria-labelledby="wordmark-title">
  <title id="wordmark-title">Permission Bureau</title>
  <!--
    The lockup: mark, a hairline separator, then the wordmark.

    The wordmark is Geist Sans at weight 600, 0.18em tracking, uppercase. Never letterspaced tighter,
    never set in the serif. The separator is the same 1px hairline used everywhere else in the product,
    because the lockup should look like it came from the same system as the tables.

    Rendered with a text element rather than outlines so it inherits currentColor and stays selectable
    and searchable. Where Geist is unavailable the fallback stack keeps the tracking, which matters
    more to the shape of the wordmark than the exact letterforms do.
  -->
  <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="butt">
    <rect x="3" y="5" width="9" height="8" fill="currentColor" stroke="none" transform="translate(9)" />
    <rect x="3" y="5" width="18" height="16" />
    <path d="M3 13H21" />
    <path d="M12 1.4V22.6" />
  </g>
  <path d="M33 3V21" stroke="currentColor" stroke-width="1" opacity="0.28" />
  <text
    x="45"
    y="17"
    fill="currentColor"
    font-family="Geist, ui-sans-serif, system-ui, sans-serif"
    font-size="15"
    font-weight="600"
    letter-spacing="2.7"
  >AUSPICE</text>
</svg>
