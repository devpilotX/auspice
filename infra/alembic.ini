[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/../src
path_separator = os
version_path_separator = os
# The URL is read from AUSPICE_DATABASE_URL by env.py. Leaving it blank here keeps the
# connection string out of git.
sqlalchemy.url =

[post_write_hooks]
# Generated revisions are formatted by `uv run ruff format` in the same commit. Running
# ruff as an alembic entrypoint hook does not resolve inside the uv managed environment.
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
