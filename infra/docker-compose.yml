services:
  db:
    build:
      context: ..
      dockerfile: infra/Dockerfile.db
    image: auspice-db:postgres17-postgis3.5-pgvector0.8.5
    environment:
      POSTGRES_USER: auspice
      POSTGRES_PASSWORD: auspice
      POSTGRES_DB: auspice
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auspice -d auspice"]
      interval: 2s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      AUSPICE_ENV: production
      AUSPICE_DATABASE_URL: postgresql+psycopg://auspice:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/auspice
      AUSPICE_RAW_BACKEND: s3
      AUSPICE_RAW_BUCKET: ${AUSPICE_RAW_BUCKET:?set AUSPICE_RAW_BUCKET}
      AUSPICE_RAW_ACCESS_KEY_ID: ${AUSPICE_RAW_ACCESS_KEY_ID:?set AUSPICE_RAW_ACCESS_KEY_ID}
      AUSPICE_RAW_SECRET_ACCESS_KEY: ${AUSPICE_RAW_SECRET_ACCESS_KEY:?set AUSPICE_RAW_SECRET_ACCESS_KEY}
      AUSPICE_API_KEYS: ${AUSPICE_API_KEYS:?set AUSPICE_API_KEYS}
      AUSPICE_CRAWLER_CONTACT: ${AUSPICE_CRAWLER_CONTACT:?set AUSPICE_CRAWLER_CONTACT}
      AUSPICE_API_CORS_ORIGINS: ${AUSPICE_API_CORS_ORIGINS:-http://localhost:3000}
      AUSPICE_API_TRUST_FORWARDED_FOR: ${AUSPICE_API_TRUST_FORWARDED_FOR:-false}
      AUSPICE_SENTRY_DSN: ${AUSPICE_SENTRY_DSN:-}
      AUSPICE_SENTRY_TRACES_SAMPLE_RATE: ${AUSPICE_SENTRY_TRACES_SAMPLE_RATE:-0.0}
      AUSPICE_METRICS_TOKEN: ${AUSPICE_METRICS_TOKEN:-}
      AUSPICE_LEDGER_ANCHOR_URL: ${AUSPICE_LEDGER_ANCHOR_URL:-}
      AUSPICE_ALERT_CHANNEL: ${AUSPICE_ALERT_CHANNEL:-log}
      AUSPICE_ALERT_WEBHOOK_URL: ${AUSPICE_ALERT_WEBHOOK_URL:-}
      AUSPICE_ALERT_SMTP_HOST: ${AUSPICE_ALERT_SMTP_HOST:-}
      AUSPICE_ALERT_SMTP_PORT: ${AUSPICE_ALERT_SMTP_PORT:-587}
      AUSPICE_ALERT_SMTP_USERNAME: ${AUSPICE_ALERT_SMTP_USERNAME:-}
      AUSPICE_ALERT_SMTP_PASSWORD: ${AUSPICE_ALERT_SMTP_PASSWORD:-}
      AUSPICE_ALERT_SMTP_STARTTLS: ${AUSPICE_ALERT_SMTP_STARTTLS:-true}
      AUSPICE_ALERT_SENDER: ${AUSPICE_ALERT_SENDER:-}
      AUSPICE_ALERT_FALLBACK_RECIPIENT: ${AUSPICE_ALERT_FALLBACK_RECIPIENT:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
