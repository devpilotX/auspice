  # =========================================================================
  # Established and emerging markets, chosen to span board size, legal framework
  # and prior industrial character.
  # =========================================================================
  - slug: us-oh-licking
    name: Licking County
    kind: county
    region: OH
    fips: "39089"
    admin_codes:
      state_fips: "39"
      county_fips: "089"
      census_geoid: "39089"
    legal_framework: dillons_rule
    legal_framework_source:
      value: >-
        Ohio grants home rule to municipalities but not to non charter counties, which hold
        only the powers the General Assembly confers. Licking County is not a charter county,
        so it is treated as Dillon's Rule.
      source: https://www.nlc.org/resource/cities-101-delegation-of-power/
      retrieved_on: 2026-08-27
    target_use_classes: [data_center_hyperscale, data_center_colocation, substation_transmission]
    why_in_scope: >-
      Multiple hyperscale campuses landed here inside three years, so it is the clearest case
      of a county whose base rate changed regime mid sample. That is exactly what
      approval_rate_trend is meant to catch.
    bodies:
      - name: Board of County Commissioners
        kind: county_commission
        seats: 3
        quorum: 2
        vote_threshold: simple_majority
        recommendation_is_binding: false
        election_rule:
          term_years: 4
          anchor_year: 2024
          stagger_offset_years: 2
          source: https://www.nlc.org/resource/cities-101-delegation-of-power/
          retrieved_on: 2026-08-27
        source: https://lickingcounty.gov/
        retrieved_on: 2026-08-27
    sources:
      - kind: agenda
        platform: unknown
        url: https://lickingcounty.gov/
        refresh_hours: 24
    notes: >-
      Much of the hyperscale activity sits inside municipalities that annexed the land, so the
      jurisdiction chain for a parcel here often ends at a city rather than the county. The
      spatial join has to resolve that, and it is the main reason this county is in the first
      twelve.

