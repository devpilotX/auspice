# The jurisdiction registry.
#
# Stage 0 of the pipeline, and the file everything else depends on. Section 6.0: build this
# by hand before writing a single scraper, because a pipeline pointed at the wrong body
# produces a corpus that looks complete and is worthless.
#
# Rules for editing this file:
#
#   1. Every assertion that is not directly observable carries a source URL and the date it
#      was read. The Pydantic model in src/auspice/pipeline/registry/models.py refuses a
#      jurisdiction whose legal_framework has no source.
#   2. Boundary geometry is not in this file. It is fetched from the Census TIGERweb service
#      keyed on the FIPS code, by `auspice registry boundaries`. A hand typed polygon has no
#      provenance and cannot be checked.
#   3. civic_platform is left as unknown here and detected from the live site by
#      `auspice registry probe`, which writes data/registry/platforms.detected.yaml. This file
#      stays hand authored; the detected file is regenerable.
#   4. discretion_index is not in this file either. It is computed from the jurisdiction's
#      own decision history by `auspice registry recompute`. Asserting it by hand would be
#      inventing the number the model is supposed to learn.
#   5. Election calendars are expressed as a rule, not a list of dates. A pasted list rots and
#      a wrong date silently corrupts months_to_next_election. See registry/elections.py.
#
# Twelve counties, not forty. Section 10.1 argues for forty and it is right about the target,
# but depth beats breadth absolutely, and twelve counties labelled properly is a better
# foundation than forty counties labelled thinly. The remaining twenty eight are added as the
# labelling work reaches them.

