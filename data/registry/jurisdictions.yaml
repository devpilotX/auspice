  - slug: us-tx-tarrant
    name: Tarrant County
    kind: county
    region: TX
    fips: "48439"
    admin_codes:
      state_fips: "48"
      county_fips: "439"
      census_geoid: "48439"
    legal_framework: dillons_rule
    legal_framework_source:
      value: >-
        Texas counties hold only powers granted by the legislature under the Local Government
        Code, and notably have no general zoning power outside municipal limits. Texas home
        rule cities are the opposite case.
      source: https://statutes.capitol.texas.gov/Docs/LG/htm/LG.81.htm
      retrieved_on: 2026-08-27
    target_use_classes: [data_center_hyperscale, data_center_colocation, battery_storage]
    why_in_scope: >-
      Texas counties cannot zone, so almost every discretionary decision for this use class
      happens inside a city. Including the county forces the jurisdiction chain resolution to
      be correct rather than convenient, and Fort Worth's 2026 data centre ordinance fight is
      the specific decision to test it against.
    bodies:
      - name: Commissioners Court
        kind: county_commission
        seats: 5
        quorum: 3
        vote_threshold: simple_majority
        recommendation_is_binding: false
        election_rule:
          term_years: 4
          anchor_year: 2024
          stagger_offset_years: 2
          source: https://statutes.capitol.texas.gov/Docs/LG/htm/LG.81.htm
          retrieved_on: 2026-08-27
        source: https://www.tarrantcountytx.gov/
        retrieved_on: 2026-08-27
    sources:
      - kind: agenda
        platform: unknown
        url: https://www.tarrantcountytx.gov/
        refresh_hours: 24
    notes: >-
      Five members: the county judge, elected countywide, plus four precinct commissioners. The
      county judge votes. Because Texas counties have no zoning authority, the discretion_index
      computed for this county will be low and that is correct, not a data gap. The municipal
      jurisdictions inside it are the ones that carry the decisions.
