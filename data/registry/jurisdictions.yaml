  - slug: us-or-morrow
    name: Morrow County
    kind: county
    region: OR
    fips: "41049"
    admin_codes:
      state_fips: "41"
      county_fips: "049"
      census_geoid: "41049"
    legal_framework: mixed
    legal_framework_source:
      value: >-
        Oregon counties may adopt a home rule charter but are otherwise governed by general
        law. Morrow County is a general law county, and Oregon's statewide land use programme
        constrains local discretion in a way that has no analogue in the other states here, so
        the framework is recorded as mixed rather than forced into a binary.
      source: https://www.nlc.org/resource/cities-101-delegation-of-power/
      retrieved_on: 2026-08-27
    target_use_classes: [data_center_hyperscale, data_center_colocation, wind_onshore, solar_utility]
    why_in_scope: >-
      A small rural county carrying a very large data centre load, under a statewide land use
      regime. It is the strongest single test of whether the model generalises across legal
      regimes rather than memorising one.
    bodies:
      - name: Board of Commissioners
        kind: county_commission
        seats: 3
        quorum: 2
        vote_threshold: simple_majority
        recommendation_is_binding: false
        election_rule:
          term_years: 4
          anchor_year: 2024
          stagger_offset_years: 2
          source: https://www.nlc.org/resource/cities-101-delegation-of-power/
          retrieved_on: 2026-08-27
        source: https://www.co.morrow.or.us/
        retrieved_on: 2026-08-27
    sources:
