  # =========================================================================
  # The 2026 moratorium belt. Every one of these appears in section 18.2 of the
  # specification as documented evidence that the trend is accelerating.
  # =========================================================================
  - slug: us-in-boone
    name: Boone County
    kind: county
    region: IN
    fips: "18011"
    admin_codes:
      state_fips: "18"
      county_fips: "011"
      census_geoid: "18011"
    legal_framework: home_rule
    legal_framework_source:
      value: >-
        Indiana granted units of local government home rule powers in Title 36, so a county
        may act unless the General Assembly has withheld the power. That is the opposite
        default from Virginia and it changes how much a state level pre-emption feature is
        worth here.
      source: https://iga.in.gov/laws/2024/ic/titles/36
      retrieved_on: 2026-08-27
    target_use_classes: [data_center_hyperscale, data_center_colocation]
    why_in_scope: >-
      Adopted a data centre moratorium in June 2026 after a large announced project, and had
      previously commissioned a paid single site certification study, which is direct evidence
      of willingness to pay for exactly this analysis.
    bodies:
      - name: Board of County Commissioners
        kind: county_commission
        seats: 3
        quorum: 2
        vote_threshold: simple_majority
        recommendation_is_binding: false
        election_rule:
          term_years: 4
          anchor_year: 2024
          stagger_offset_years: 2
          source: https://iga.in.gov/laws/2024/ic/titles/36
          retrieved_on: 2026-08-27
        source: https://boonecounty.in.gov/
        retrieved_on: 2026-08-27
    sources:
      - kind: agenda
        platform: unknown
        url: https://boonecounty.in.gov/
        refresh_hours: 24
    notes: >-
      The Area Plan Commission is the recommending body for rezonings here, and its seat
      composition is set by interlocal agreement rather than published as a fixed number. It is
      deliberately not asserted until the composition is read from a primary source.

