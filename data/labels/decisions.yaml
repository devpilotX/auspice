  - label_id: sarasota-hyperscale-moratorium-2026
    jurisdiction: us-fl-sarasota
    labelled_by: Permission Bureau
    labelled_on: 2026-08-27
    kind: moratorium
    body: county_commission
    title: Moratorium on acceptance, review and approval of major data centres
    adopted_on: 2026-07-08
    effective_on: 2026-07-08
    expires_on: 2027-07-08
    applies_to_use_classes: [data_center_hyperscale]
    restrictions:
      stops_acceptance: true
      stops_review: true
      stops_approval: true
      scope: "major or hyperscale facilities"
    notes: >-
      Adopted with no data centre applications pending, which is the pre-emptive case and the
      hardest one for a model built only on decision history. There are no decisions to learn
      from here, so a flat model would score this county on the state average and be badly wrong.
      This is precisely the row that justifies the rule change hazard model existing separately
      from the approval model.
