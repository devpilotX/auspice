  - label_id: cheyenne-data-center-moratorium-rejected-2026
    jurisdiction: us-wy-laramie
    labelled_by: Permission Bureau
    labelled_on: 2026-08-27
    kind: moratorium
    body: city_council
    title: Proposed twelve month data centre moratorium, rejected on second reading
    proposed_but_not_adopted: true
    effective_on: 2026-05-26
    applies_to_use_classes: [data_center_hyperscale, data_center_colocation]
    vote_for: 1
    vote_against: 8
    notes: >-
      The negative case, and the corpus needs it more than it needs another moratorium. A model
      trained only on jurisdictions that restricted the use class will over predict restriction
      everywhere, and that error is invisible until it costs a customer a site they could have
      built on. Defeated eight to one on second reading, with only the sponsor in favour, after
      public comment ran to 27 speakers for and 25 against. That margin matters: a restriction that
      fails one to eight is not a near miss, and a jurisdiction that rejects a moratorium this
      decisively should not be scored like one that adopted one. Recorded against Laramie County
      because Cheyenne sits inside it; the council is a municipal body and the registry does not
      yet carry the city as its own jurisdiction, which is a known gap noted in
      docs/DATA_SOURCES.md.
    citations:
      - url: https://capcity.news/community/city/2026/05/27/cheyenne-city-council-rejects-data-center-moratorium/
        document_title: "Cheyenne City Council rejects data center moratorium"
        quote: "The Cheyenne City Council overwhelmingly rejected a proposed 12-month moratorium on new data center developments, defeating the ordinance 8\u20131 after an hours-long debate over local resources, economic growth, jobs and the loss of Wyoming\u2019s rural nature."
        retrieved_on: 2026-08-27
        kind: secondary
      - url: https://capcity.news/community/city/2026/05/27/cheyenne-city-council-rejects-data-center-moratorium/
        document_title: "Cheyenne City Council rejects data center moratorium"
        quote: "The ordinance, which would have temporarily stopped the processing of permits and zoning changes for new data center facilities, was shot down on second reading with only the measure\u2019s sponsor, Councilor Mark Moody, voting in favor."
        retrieved_on: 2026-08-27
        kind: primary
