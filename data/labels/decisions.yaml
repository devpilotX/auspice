# The labelled decision dataset.
#
# Read data/labels/README.md before adding a row. The short version: every row carries either
# one official record or two independent contemporary reports, and every citation carries a
# verbatim quote that `auspice labels verify` checks against the fetched document.
#
# This file is well short of the 400 rows the kill test requires. That is stated here rather
# than hidden, and `auspice labels stats` prints the gap. Nothing plausible looking has been
# added to close it. A fabricated row produces a kill test that passes and a company that does
# not work.

version: "0.1.0"
protocol: "data/labels/README.md"
compiled_on: 2026-08-27

# ===========================================================================
# DECISIONS
# Applications by a project to a body, and what the body did.
# ===========================================================================
decisions:
  - label_id: pwc-digital-gateway-rezoning-2023
    jurisdiction: us-va-prince-william
    labelled_by: Permission Bureau
    labelled_on: 2026-08-27
    case_number: null
    body: board_of_supervisors
    applicant: QTS Data Centers and Compass Datacenters
    project_name: PW Digital Gateway
    use_class: data_center_hyperscale
    relief_sought: [rezoning, comprehensive_plan_amendment]
    by_right: false
    acres: 2100
    decided_on: 2023-12-13
    outcome: approved
    vote_for: 4
    vote_against: 3
    vote_abstain: 1
    objection_grounds: [environmental, visual, process, water]
    organised_opposition: true
    notes: >-
      Approved after a hearing that ran roughly 27 to 28 hours. A circuit court later voided the
      rezoning on procedural grounds, the Court of Appeals affirmed on 31 March 2026, and the
      remaining developer dropped its appeal, so the project is dead. The label records what the
      body decided, which is what model 1 predicts. Post approval reversal is a separate risk
      and is carried as litigation events rather than folded into the approval label. See
      docs/METHODOLOGY.md, the section on what counts as a yes.
    citations:
      - url: https://wtop.com/prince-william-county/2023/12/prince-william-supervisors-approve-pw-digital-gateway-expected-to-be-the-worlds-largest-data-center-corridor/
        document_title: "Prince William supervisors approve PW Digital Gateway, expected to be the world's largest data center corridor"
        quote: "The final vote in favor was 4-3, with Democratic Supervisor Kenny Boddye of the Occoquan District abstaining."
        retrieved_on: 2026-08-27
        kind: secondary
      - url: https://www.potomaclocal.com/2023/12/13/prince-william-is-new-data-center-king-digital-gateway-approved/
        document_title: "Prince William soon to be new data center king"
        quote: "The Prince William Board of County Supervisors approved the contentious project after a record-breaking 28-hour meeting that began at 10 a.m. Tuesday, Dec. 12, and wrapped up just after 1 p.m. today, Wednesday, Dec. 13, 2023."
        retrieved_on: 2026-08-27
        kind: secondary
      - url: https://www.pwcva.gov/department/planning-office/pw-digital-gateway/
        document_title: "PW Digital Gateway, Prince William County Planning Office"
        quote: "The Board of County Supervisors decisions to approve the rezoning of the property are void and the zoning of the properties reverts back to the original zoning district immediately prior to the Board of County Supervisors approval of the rezonings."
        retrieved_on: 2026-08-27
        kind: primary

# ===========================================================================
# INSTRUMENTS
# The rules, and when they changed. Section 6.6: knowing the current ordinance is a
# commodity three companies already sell. Knowing that it changed 90 days ago, who
# moved it, and which neighbouring county is next, is the product.
# ===========================================================================
instruments:
  - label_id: loudoun-zoam-2025-0001-by-right-ended
    jurisdiction: us-va-loudoun
    labelled_by: Permission Bureau
    labelled_on: 2026-08-27
    kind: zoning_ordinance
    body: board_of_supervisors
    citation_ref: "ZOAM and CPAM adopted 18 March 2025"
    title: Zoning Ordinance amendment making data centres a special exception use
    adopted_on: 2025-03-18
    effective_on: 2025-03-18
    applies_to_use_classes: [data_center_hyperscale, data_center_colocation, data_center_edge]
    vote_for: 7
    vote_against: 2
    restrictions:
      by_right_removed: true
      requires_special_exception: true
    notes: >-
      The single most consequential rule change in the corpus. It converted the largest data
      centre market in the world from ministerial approval to a discretionary public hearing,
      which is exactly the transition the discretion_index is meant to measure. Adopted seven to
      two, so it is durable rather than one seat away from reversal.
    citations:
      - url: https://www.mcguirewoods.com/client-resources/alerts/2025/4/loudoun-county-eliminates-by-right-use-for-data-centers-increasing-development-hurdles/
        document_title: "Loudoun County Eliminates By-Right Use for Data Centers, Increasing Development Hurdles"
        quote: "At its March 18, 2025, business meeting, the Loudoun County Board of Supervisors voted 7-2 to approve a Zoning Ordinance amendment making data centers a special exception use in zoning districts in which they were previously a by-right use."
        retrieved_on: 2026-08-27
        kind: secondary
      - url: https://www.hklaw.com/en/insights/publications/2025/04/loudoun-county-virginia-eliminates-by-right-data-center-development
        document_title: "Loudoun County, Virginia, Eliminates By-Right Data Center Development"
        quote: "On March 18, 2025, the Loudoun County Board of Supervisors approved a comprehensive plan amendment (CPAM) and zoning ordinance amendment (ZOAM) that eliminated by-right development of data centers within Loudoun County."
        retrieved_on: 2026-08-27
        kind: secondary
      - url: https://www.loudoun.gov/6221/Phase-1-Project-Plan-for-Data-Center-Sta
        document_title: "Phase 1: Project Plan for Data Center Standards and Locations"
        quote: "The Board also adopted a Grandfathering Resolution. This resolution outlines rules under which certain data center applications accepted prior to February 12, 2025, may continue to be reviewed and processed without obtaining SPEX approval for a data center use."
        retrieved_on: 2026-08-27
        kind: primary

  - label_id: loudoun-grandfathering-resolution-2025
    jurisdiction: us-va-loudoun
    labelled_by: Permission Bureau
    labelled_on: 2026-08-27
    kind: resolution
    body: board_of_supervisors
    citation_ref: "2025 Data Center Grandfathering Resolution"
    title: Grandfathering resolution for applications accepted before 12 February 2025
    adopted_on: 2025-03-18
    effective_on: 2025-03-18
    applies_to_use_classes: [data_center_hyperscale, data_center_colocation]
    restrictions:
      cutoff_date: "2025-02-12"
      exempts_from_special_exception: true
    notes: >-
      Adopted the same day as the ordinance amendment and by a narrow margin, which is why it is
      a separate row. It is the clearest example in the corpus of a rule whose expiry is itself
      a forecastable event: supervisors moved in 2026 to terminate it immediately, which would
      pull roughly ten million square feet of pipeline back into the discretionary process. Any
      score for a grandfathered site has to price that.
    citations:
      - url: https://virginiabusiness.com/loudoun-supervisors-propose-terminating-data-centers-grandfather-provisions/
        document_title: "Loudoun supervisors propose terminating grandfather provisions for data centers"
        quote: "When Loudoun County supervisors eliminated data centers as a by-right use in March 2025, they narrowly voted to grandfather applications already in the pipeline."
        retrieved_on: 2026-08-27
        kind: secondary
      - url: https://www.loudoun.gov/6221/Phase-1-Project-Plan-for-Data-Center-Sta
        document_title: "Phase 1: Project Plan for Data Center Standards and Locations"
        quote: "The Board also adopted a Grandfathering Resolution. This resolution outlines rules under which certain data center applications accepted prior to February 12, 2025, may continue to be reviewed and processed without obtaining SPEX approval for a data center use."
        retrieved_on: 2026-08-27
        kind: primary

