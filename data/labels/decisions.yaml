      process_stage: "standards development"
    notes: >-
      A work programme rather than a restriction, and it is in the corpus because a jurisdiction
      that has an open standards process is measurably more likely to change its rules again
      inside the next twelve months. That is a feature for the rule change hazard model, not a
      restriction for the approval model.
